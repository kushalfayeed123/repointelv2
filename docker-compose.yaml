version: '3.8'

services:
  # -------------------------------------------------------------------
  # Service A: Core LangGraph Gateway Server
  # -------------------------------------------------------------------
  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MCP_SERVER_URL=http://mcp_runtime:5001/sse
      - LANCE_DB_PATH=/app/shared_db/repointel_lance
    volumes:
      - lancedb_shared_volume:/app/shared_db
    depends_on:
      - mcp_runtime
    networks:
      - repointel_mesh
    restart: always

  # -------------------------------------------------------------------
  # Service C: Isolated Tool Runtime Environment (Strict Hardware Bounds)
  # -------------------------------------------------------------------
  mcp_runtime:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./workspace_cache:/app/workspace_cache
    # Enforce strict audit controls at the OS level to isolate resource runaways
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - repointel_mesh
    restart: always

volumes:
  lancedb_shared_volume:

networks:
  repointel_mesh:
    driver: bridge